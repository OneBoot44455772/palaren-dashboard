<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 帕拉伦股市 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d1117; color: #c9d1d9; padding: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 14px 18px; min-width: 130px;
  }
  .card .label { font-size: 12px; color: #8b949e; }
  .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  input, select {
    background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: #58a6ff; }
  button {
    background: #238636; border: none; color: #fff; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #2ea043; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #21262d; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #8b949e; font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: #161b22; }
  th:hover { color: #58a6ff; }
  tr:hover td { background: #161b22; }
  .up { color: #f85149; }
  .down { color: #3fb950; }
  .flat { color: #8b949e; }
  .risk-1 { color: #3fb950; }
  .risk-2 { color: #d29922; }
  .risk-3 { color: #f0883e; }
  .risk-4 { color: #f85149; }
  .risk-5 { color: #a371f7; }
  .status-dead { color: #6e7681; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 12px; background: #21262d;
  }
  .badge.active { background: #1f6feb22; color: #58a6ff; }
  .badge.dead { background: #6e768122; color: #6e7681; }
  .chart-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-top: 20px; }
  #kline { width: 100%; height: 360px; }
  .footer { color: #6e7681; font-size: 12px; margin-top: 20px; text-align: center; }
  #status { font-size: 12px; color: #8b949e; margin-left: auto; }
</style>
</head>
<body>

<h1>📈 帕拉伦股市 Dashboard</h1>
<div class="sub">数据来源 pleasance.icu · <span id="lastUpdate">加载中…</span></div>

<div class="cards" id="summaryCards"></div>

<div class="toolbar">
  <input id="search" placeholder="搜索公司名 / ID…" style="flex:1; min-width:180px;">
  <select id="filterStatus">
    <option value="all">全部状态</option>
    <option value="交易中" selected>仅交易中</option>
    <option value="已破产">仅已破产</option>
  </select>
  <select id="filterRisk">
    <option value="all">全部风险</option>
    <option value="1">风险1</option>
    <option value="2">风险2</option>
    <option value="3">风险3</option>
    <option value="4">风险4</option>
    <option value="5">风险5</option>
  </select>
  <button id="refreshBtn">手动刷新</button>
  <span id="status"></span>
</div>

<table>
  <thead>
    <tr>
      <th data-sort="name">公司</th>
      <th data-sort="market_id">ID</th>
      <th data-sort="risk_level">风险</th>
      <th data-sort="status">状态</th>
      <th data-sort="price">最新价</th>
      <th data-sort="change_pct">涨跌</th>
      <th data-sort="available_shares">可售股数</th>
    </tr>
  </thead>
  <tbody id="stockBody"></tbody>
</table>

<div class="chart-wrap">
  <div style="margin-bottom:8px; color:#8b949e; font-size:13px;">
    K线图 · <span id="klineTitle">点击上方任意公司查看</span>
  </div>
  <div id="kline"></div>
</div>

<div class="footer">数据每 30 秒自动刷新 · 仅作展示用途</div>

<script>

const API = 'https://palaren-proxy.uainava.top/api';

let allStocks = [];
let sortKey = 'change_pct';
let sortAsc = false;
let selectedId = null;
const chart = echarts.init(document.getElementById('kline'), 'dark');

async function fetchOverview() {
  const res = await fetch(`${API}/overview`);
  if (!res.ok) throw new Error('overview ' + res.status);
  return res.json();
}

async function fetchKline(id) {
  const res = await fetch(`${API}/kline/${id}?interval=15m`);
  if (!res.ok) return null;
  return res.json();
}

function renderSummary(data) {
  const s = data.summary || {};
  const cards = [
    { label: '公司数', value: s.companies ?? '-' },
    { label: '交易中', value: s.active ?? '-' },
    { label: '上涨', value: s.advancing ?? '-', cls: 'up' },
    { label: '下跌', value: s.declining ?? '-', cls: 'down' },
    { label: '可售总股数', value: (s.available_shares ?? 0).toLocaleString() },
    { label: '今日净流入', value: (data.today?.net ?? 0).toLocaleString(), cls: (data.today?.net ?? 0) >= 0 ? 'up' : 'down' },
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value ${c.cls||''}">${c.value}</div></div>`
  ).join('');
  if (data.generated_at) {
    document.getElementById('lastUpdate').textContent = '最后更新 ' + new Date(data.generated_at).toLocaleTimeString();
  }
}

function renderTable() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const fs = document.getElementById('filterStatus').value;
  const fr = document.getElementById('filterRisk').value;

  let list = allStocks.filter(s => {
    if (kw && !(s.name.toLowerCase().includes(kw) || String(s.market_id).includes(kw))) return false;
    if (fs !== 'all' && s.status !== fs) return false;
    if (fr !== 'all' && String(s.risk_level) !== fr) return false;
    return true;
  });

  list.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (va == null) va = -Infinity;
    if (vb == null) vb = -Infinity;
    if (typeof va === 'string') va = va.localeCompare(vb, 'zh');
    else va = va - vb;
    return sortAsc ? va : -va;
  });

  document.getElementById('stockBody').innerHTML = list.map(s => {
    const chg = s.change_pct;
    const chgCls = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
    const chgTxt = chg == null ? '-' : (chg > 0 ? '+' : '') + chg.toFixed(2) + '%';
    const price = s.price == null ? '-' : s.price.toFixed(2);
    const shares = s.available_shares == null ? '-' : s.available_shares.toLocaleString();
    const statusCls = s.status === '交易中' ? 'active' : 'dead';
    const rowCls = s.status === '交易中' ? '' : 'status-dead';
    const sel = s.company_id === selectedId ? 'style="background:#1f6feb22"' : '';
    return `<tr ${sel} class="${rowCls}" data-id="${s.company_id}" style="cursor:pointer">
      <td>${s.name}</td>
      <td>${s.market_id}</td>
      <td class="risk-${s.risk_level}">风险${s.risk_level}</td>
      <td><span class="badge ${statusCls}">${s.status}</span></td>
      <td>${price}</td>
      <td class="${chgCls}">${chgTxt}</td>
      <td>${shares}</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('#stockBody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      selectedId = Number(tr.dataset.id);
      renderTable();
      loadKline(selectedId);
    });
  });
}

async function loadKline(id) {
  const s = allStocks.find(x => x.company_id === id);
  document.getElementById('klineTitle').textContent = s ? `${s.name} (#${s.market_id})` : `#${id}`;
  chart.showLoading();
  try {
    const data = await fetchKline(id);
    chart.hideLoading();
    if (!data) { chart.clear(); return; }
    const arr = Array.isArray(data) ? data : (data.candles || data.data || data.items || []);
    if (!arr.length) { chart.clear(); return; }
    const times = arr.map(d => d.time || d.t || d.timestamp || d.date);
    const kdata = arr.map(d => [d.open, d.close, d.low, d.high]);
    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
      grid: { left: 50, right: 20, top: 20, bottom: 40 },
      xAxis: { type: 'category', data: times, axisLine: { lineStyle: { color: '#30363d' } } },
      yAxis: { scale: true, splitLine: { lineStyle: { color: '#21262d' } } },
      dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: 0, height: 20 }],
      series: [{
        type: 'candlestick',
        data: kdata,
        itemStyle: {
          color: '#f85149', color0: '#3fb950',
          borderColor: '#f85149', borderColor0: '#3fb950'
        }
      }]
    });
  } catch (e) {
    chart.hideLoading();
    console.error(e);
  }
}

async function refresh() {
  const st = document.getElementById('status');
  st.textContent = '刷新中…';
  try {
    const data = await fetchOverview();
    allStocks = data.latest_updates || [];
    renderSummary(data);
    renderTable();
    st.textContent = '✓ ' + new Date().toLocaleTimeString();
  } catch (e) {
    st.textContent = '✗ ' + e.message;
    console.error(e);
  }
}

document.getElementById('search').addEventListener('input', renderTable);
document.getElementById('filterStatus').addEventListener('change', renderTable);
document.getElementById('filterRisk').addEventListener('change', renderTable);
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortAsc = !sortAsc;
    else { sortKey = k; sortAsc = false; }
    renderTable();
  });
});
window.addEventListener('resize', () => chart.resize());

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
